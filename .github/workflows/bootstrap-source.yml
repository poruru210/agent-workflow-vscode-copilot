name: Bootstrap source

on:
  push:
    branches: [agent/initial-workflow]
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find bootstrap -maxdepth 1 -type f -name 'part-*.b64' | wc -l)" -eq 27
          cat bootstrap/part-*.b64 | base64 --decode > /tmp/source.zip
          echo "7e6302241a7162b4467a035b3add41950712a2484e00c4910585b7f0d1248e14  /tmp/source.zip" | sha256sum --check -
          unzip -oq /tmp/source.zip -d .
          rm -rf bootstrap

      - name: Validate extracted package before commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r validation/requirements.txt
          cd extension
          npm install --ignore-scripts --no-audit --no-fund
          cd ..
          python validation/validate.py
          sha256sum --check MANIFEST.sha256

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add VS Code Copilot agent workflow"
          git push origin HEAD:agent/initial-workflow
