name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: validation/requirements.txt

      - name: Install Python validation dependency
        run: python -m pip install -r validation/requirements.txt

      - name: Install extension build dependencies
        working-directory: extension
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run repository validator
        run: python validation/validate.py

      - name: Run extension tests
        working-directory: extension
        run: npm test

      - name: Package with official vsce
        working-directory: extension
        run: npx --no-install vsce package --allow-missing-repository --out dist/ci-vsce.vsix

      - name: Inspect official vsce package
        shell: python
        run: |
          import json, zipfile
          from pathlib import Path
          p = Path('extension/dist/ci-vsce.vsix')
          assert p.exists() and p.stat().st_size > 0
          with zipfile.ZipFile(p) as z:
              names = set(z.namelist())
              required = {'extension/package.json', 'extension/out/extension.js', 'extension.vsixmanifest', '[Content_Types].xml'}
              missing = required - names
              assert not missing, f'missing VSIX entries: {sorted(missing)}'
              pkg = json.loads(z.read('extension/package.json'))
              assert pkg['publisher'] == 'agent-workflow'
              assert pkg['name'] == 'model-catalog'
              assert pkg['version'] == '0.3.0'
          print('official vsce package inspection PASS')

      - name: Upload validation packages
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: |
            extension/dist/agent-workflow-model-catalog-0.3.0.vsix
            extension/dist/ci-vsce.vsix
          if-no-files-found: error

  manifest:
    name: Verify manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify SHA-256 manifest
        run: sha256sum --check MANIFEST.sha256
